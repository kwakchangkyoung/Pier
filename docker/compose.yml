name: pier

services:
  minio:
    # 공식 이미지 배포 중단으로 docker/minio.Dockerfile에서 소스를 직접 빌드한다.
    # image 태그의 RELEASE.* 부분은 Dockerfile의 ARG MINIO_TAG와 동일하게 유지한다.
    build:
      context: .
      dockerfile: minio.Dockerfile
    image: pier-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: pier-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  minio-data:

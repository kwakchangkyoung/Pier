name: Pier
packages:
  # 자동 업데이트 프레임워크. CI의 appcast 서명 도구와 같은 버전을 유지한다.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"

options:
  bundleIdPrefix: com.gajago
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM은 비워 둔다. 사용자가 Xcode의 Signing & Capabilities에서 팀을 지정한다.
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    SWIFT_VERSION: "5.0"
  configs:
    Release:
      # 배포는 개발자 ID 없이 ad-hoc 서명만 한다 (SPEC Phase 5).
      CODE_SIGN_IDENTITY: "-"

targets:
  Pier:
    type: application
    platform: macOS
    sources:
      - path: PierApp
      - path: Assets.xcassets
      - path: Generated/pier_ffi.swift
        optional: true
    dependencies:
      - framework: Frameworks/PierCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      # 앱 타깃이므로 Sparkle.framework가 자동으로 임베드·재서명된다.
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gajago.pier
        INFOPLIST_FILE: Config/PierApp-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Rust 코어(reqwest 등)가 요구하는 libresolv
        OTHER_LDFLAGS: "$(inherited) -lresolv"

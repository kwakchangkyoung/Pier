name: Pier
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM은 비워 둔다. 사용자가 Xcode의 Signing & Capabilities에서 팀을 지정한다.
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"

targets:
  Pier:
    type: application
    platform: macOS
    sources:
      - path: PierApp
      - path: Generated/pier_ffi.swift
        optional: true
    dependencies:
      - framework: Frameworks/PierCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pier
        INFOPLIST_FILE: Config/PierApp-Info.plist
        # Rust 코어(reqwest 등)가 요구하는 libresolv
        OTHER_LDFLAGS: "$(inherited) -lresolv"
